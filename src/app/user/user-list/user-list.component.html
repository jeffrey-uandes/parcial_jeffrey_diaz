<div class="users-master-detail d-flex h-100">
  <section class="user-list-container d-flex flex-column h-100">
    <div
      class="px-3 py-3 sticky-top"
      style="background-color: var(--gh-bg); border-bottom: 1px solid var(--gh-border); z-index: 10"
    >
      <p
        class="text-uppercase text-muted fw-semibold mb-2"
        style="font-size: 11px; letter-spacing: 0.08em"
      >
        All Users
      </p>

      <div class="d-flex gap-2">
        <button class="btn btn-sm gh-filter-btn active">Active</button>
        <button class="btn btn-sm gh-filter-btn">Staff</button>
      </div>
    </div>

    <div class="flex-fill overflow-y-auto">
      <div
        *ngFor="let user of users; let i = index"
        class="gh-user-list-item"
        [class.selected]="selectedUser?.id === user.id"
        (click)="selectUser(user)"
      >
        <img
          [src]="user.avatarUrl"
          [alt]="user.username"
          class="rounded-circle border flex-shrink-0"
          style="
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-color: var(--gh-border) !important;
          "
        />

        <div class="flex-fill min-w-0">
          <div class="d-flex justify-content-between align-items-baseline mb-1">
            <span
              class="fw-semibold text-truncate"
              style="font-size: 14px; color: var(--gh-text)"
              >{{ user.name }}</span
            >
            <span class="text-muted flex-shrink-0 ms-2" style="font-size: 11px">{{
              getTimestamp(i)
            }}</span>
          </div>
          <p class="mb-1 text-truncate" style="font-size: 12px; color: var(--gh-secondary)">
            &#64;{{ user.username }}
          </p>
          <p class="mb-0 text-muted text-truncate" style="font-size: 12px">
            {{ user.location }} · {{ user.role | titlecase }}
          </p>
        </div>
      </div>
    </div>
  </section>

  <section class="user-detail-panel flex-fill d-none d-md-block">
    <app-user-detail *ngIf="wasSelected" [userDetail]="selectedUser!"></app-user-detail>
  </section>

  <section class="user-detail-panel-mobile d-md-none p-3 border-top" *ngIf="wasSelected">
    <app-user-detail [userDetail]="selectedUser!"></app-user-detail>
  </section>
</div>
